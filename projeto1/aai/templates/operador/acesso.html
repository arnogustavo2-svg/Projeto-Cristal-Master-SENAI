{% extends "base.html" %}
{% block titulo %}Acesso do Operador{% endblock %}
{% block body %}
<main class="container narrow">
    <section class="panel">
        <p class="eyebrow">Identificação</p>
        <h1>Entrar com matrícula</h1>
        <form id="form-acesso" class="form-card">
            <label>Matrícula<input name="matricula" required maxlength="50"></label>
            <button class="button" type="submit">Entrar</button>
            <p class="message" id="msg-acesso"></p>
        </form>
    </section>
</main>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/operador.js') }}"></script>{% endblock %}
