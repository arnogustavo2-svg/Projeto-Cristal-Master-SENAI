{% extends "base.html" %}
{% block titulo %}Registrar Exceção{% endblock %}
{% block body %}
<main class="container narrow">
    <section class="panel">
        <h1>Registrar exceção</h1>
        <form id="form-excecao" class="form-card">
            <label>Tarefa (ID)<input name="tarefa_id" type="number"></label>
            <label>Motivo
                <select name="motivo" required>
                    <option value="pallet_nao_encontrado">Pallet não encontrado</option>
                    <option value="posicao_vazia">Posição vazia</option>
                    <option value="material_divergente">Material divergente</option>
                    <option value="quantidade_divergente">Quantidade divergente</option>
                    <option value="rfid_nao_reconhecido">RFID não reconhecido</option>
                    <option value="outro">Outro</option>
                </select>
            </label>
            <label>Observação<textarea name="observacao" maxlength="500"></textarea></label>
            <button class="button" type="submit">Registrar</button>
            <p class="message" id="msg-excecao"></p>
        </form>
    </section>
</main>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/operador.js') }}"></script>{% endblock %}
