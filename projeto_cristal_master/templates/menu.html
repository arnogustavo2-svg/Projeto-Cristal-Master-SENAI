<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <title>Menu Principal - Cristal Master</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-primary);
        }
        .menu-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: var(--radius);
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 90%;
        }
        .menu-card h1 {
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }
        .menu-card p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }
        .menu-botoes {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .btn-menu {
            background-color: var(--primary);
            color: #ffffff;
            padding: 0.9rem;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            display: block;
            transition: var(--transition);
            text-align: center;
        }
        .btn-menu:hover {
            background-color: var(--primary-hover);
        }
        .btn-lider {
            background-color: var(--text-main);
        }
        .btn-lider:hover {
            background-color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="menu-card">
        <h1>Cristal Master</h1>
        <p>Sistema de Gestão de Almoxarifado</p>
        <div class="menu-botoes">
            <a href="{{ url_for('operador') }}" class="btn-menu">🖥️ Acessar Coletor (Operador)</a>
            <a href="{{ url_for('lider') }}" class="btn-menu btn-lider">📊 Acessar Painel (Líder)</a>
        </div>
    </div>
</body>
</html>
