{% extends "base.html" %}
{% block titulo %}Operadores — Líder{% endblock %}
{% block body %}
<div class="leader-layout">
    {% include "lider/_sidebar.html" %}
    <main class="content">
        <h1>Operadores</h1>
        <form id="form-operador" class="form-card">
            <label>Matrícula<input name="matricula" required maxlength="50"></label>
            <label>Nome<input name="nome" required maxlength="120"></label>
            <label>Função<select name="funcao"><option value="separador">Separador</option><option value="empilhadeira">Operador de empilhadeira</option></select></label>
            <button class="button" type="submit">Cadastrar</button>
            <p class="message" id="msg-operador"></p>
        </form>
        <table class="tabela">
            <thead><tr><th>Matrícula</th><th>Nome</th><th>Função</th><th>Ativo</th><th>Ações</th><th>Tarefas</th></tr></thead>
            <tbody id="tabela-operadores"></tbody>
        </table>
    </main>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/lider.js') }}"></script>{% endblock %}
